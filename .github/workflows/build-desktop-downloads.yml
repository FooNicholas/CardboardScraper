name: Build desktop downloads

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft GitHub Release tag that already contains catalogue.sqlite3
        required: true
        type: string
      catalogue_version:
        description: Version displayed to users, for example 2026.09.15-dzbt17
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub documents macos-14 as its Apple-silicon hosted runner.
          - name: macos-arm64
            runner: macos-14
            artifact_path: dist/JP Price Checker.app
          - name: windows-x64
            runner: windows-latest
            artifact_path: dist/JP Price Checker
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CATALOGUE_VERSION: ${{ inputs.catalogue_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the reviewed catalogue snapshot
        shell: bash
        run: |
          mkdir -p data
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern catalogue.sqlite3 --dir data

      - name: Install desktop build tools
        run: python -m pip install --no-build-isolation ".[packaging]"

      - name: Build native download
        shell: python
        run: |
          import os
          import subprocess
          import sys

          subprocess.run(
              [
                  sys.executable,
                  "scripts/build_desktop.py",
                  "--catalogue",
                  "data/catalogue.sqlite3",
                  "--version",
                  os.environ["CATALOGUE_VERSION"],
                  "--output",
                  "dist",
              ],
              check=True,
          )

      - name: Archive native app
        shell: python
        run: |
          from pathlib import Path
          from shutil import make_archive

          app = Path("${{ matrix.artifact_path }}")
          release = Path("release")
          release.mkdir(exist_ok=True)
          make_archive(str(release / "jp-price-checker-${{ matrix.name }}-${{ inputs.catalogue_version }}"), "zip", app.parent, app.name)

      - name: Upload native app artifact
        uses: actions/upload-artifact@v4
        with:
          name: jp-price-checker-${{ matrix.name }}-${{ inputs.catalogue_version }}
          path: release/jp-price-checker-${{ matrix.name }}-${{ inputs.catalogue_version }}.zip
          if-no-files-found: error

  attach-to-draft-release:
    name: Attach downloads to draft release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Download native archives
        uses: actions/download-artifact@v4
        with:
          pattern: jp-price-checker-*
          merge-multiple: true
          path: release

      - name: Attach native downloads
        shell: bash
        run: gh release upload "$RELEASE_TAG" release/*.zip --clobber --repo "$GITHUB_REPOSITORY"
